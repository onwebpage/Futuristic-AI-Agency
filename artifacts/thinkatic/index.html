    <!-- Inline critical CSS: prevent flash of unstyled background -->
    <style>
      html, body { background-color: #050508; color: #f5f5f5; }
      #root { min-height: 100dvh; }
      /* Skip-to-content */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 6px;
        z-index: 9999;
        padding: 8px 16px;
        border-radius: 8px;
        background: #47A3FF;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: top 0.15s;
      }
      .skip-link:focus {
        top: 6px;
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
    </style>
